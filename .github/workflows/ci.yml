name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: harehare/setup-mq@cfe56378737401938b84d329d42f63cafa263a71 # v1
        with:
          bins: test
      - name: Run tests
        run: mq-test typst_tests.mq
